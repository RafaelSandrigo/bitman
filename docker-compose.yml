# Bitman — servidor compartilhado (docs/adr/0010-infraestrutura-homelab.md).
#
# Convenções do servidor:
#   - Borda: Cloudflare (TLS) -> túnel -> Traefik compartilhado na rede externa "prod-network".
#   - Sem "ports:". Só bitman-web e bitman-games entram na prod-network.
#   - Este diretório é PRODUÇÃO: use o Makefile; nunca "docker ... prune" nem comandos fora do projeto.
#
# Produção (docs/implantacao.md): app, queue, scheduler, bitman-web, bitman-games, git-sandbox e
# egress-proxy rodam imagens geradas de um commit por "make release" (contexto ./.release, um
# "git archive" do commit). Editar arquivos aqui não muda produção até o próximo release.
# Desenvolvimento: os serviços do perfil "dev" (test e frontend) montam o código por bind mount
# e só rodam sob demanda (make test, make composer, make npm).

name: bitman

x-limits: &small
  cpus: "0.25"
  memory: 128M

x-php: &php
  image: bitman-php:release
  # A imagem é construída pelo serviço "app" (evita três builds concorrentes da mesma tag).
  pull_policy: never
  env_file: [.env]
  restart: unless-stopped
  volumes:
    # Fonte única de configuração: o .env da raiz (o Laravel procura por backend/.env).
    - ./.env:/var/www/html/.env:ro
    - quarantine:/var/bitman/quarantine
    - artifacts:/var/bitman/artifacts
    - media:/var/bitman/media
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  bitman-web:
    image: bitman-web:release
    build:
      context: ./.release
      dockerfile: docker/web/Dockerfile
      args:
        VITE_GAMES_ORIGIN: ${GAMES_ORIGIN}
        # M10: o commit do release (make release), para o aviso de nova versão do hub.
        VITE_BITMAN_BUILD: ${BITMAN_BUILD:-}
    restart: unless-stopped
    environment:
      GAMES_ORIGIN: ${GAMES_ORIGIN}
    volumes:
      # Thumbnails já re-codificadas em WebP pelo backend (A4).
      - media:/srv/media:ro
    depends_on: [app]
    networks: [prod-network, internal]
    deploy:
      resources:
        limits: *small
    healthcheck:
      # 127.0.0.1: no alpine, "localhost" resolve primeiro para ::1.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=prod-network"
      - "traefik.http.routers.bitman.rule=Host(`${HUB_DOMAIN}`)"
      - "traefik.http.routers.bitman.entrypoints=web"
      - "traefik.http.routers.bitman.service=bitman-web"
      - "traefik.http.routers.bitman.middlewares=bitman-noindex"
      - "traefik.http.services.bitman-web.loadbalancer.server.port=80"
      # Pré-lançamento: remover este middleware no lançamento (docs/plano.md).
      - "traefik.http.middlewares.bitman-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow"

  bitman-games:
    image: bitman-games:release
    build:
      context: ./.release
      dockerfile: docker/games/Dockerfile
    restart: unless-stopped
    environment:
      GAMES_ORIGIN: ${GAMES_ORIGIN}
      HUB_ORIGIN: ${HUB_ORIGIN}
    volumes:
      - type: volume
        source: artifacts
        target: /srv/games
        read_only: true
        volume:
          subpath: served
    networks: [prod-network]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=prod-network"
      - "traefik.http.routers.bitman-games.rule=Host(`${GAMES_DOMAIN}`)"
      - "traefik.http.routers.bitman-games.entrypoints=web"
      - "traefik.http.routers.bitman-games.service=bitman-games"
      - "traefik.http.services.bitman-games.loadbalancer.server.port=80"

  app:
    <<: *php
    build:
      context: ./.release
      dockerfile: docker/php/Dockerfile
      target: prod
      args:
        CONFIG_DIR: docker/php
    networks: [internal, egress]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  queue:
    <<: *php
    # Processa repositórios hostis (ingestion): nunca como root.
    user: www-data
    command: ["php", "artisan", "queue:work", "redis", "--queue=ingestion,default", "--sleep=1", "--tries=1", "--max-time=3600"]
    networks: [internal, egress, sandbox]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  scheduler:
    <<: *php
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    networks: [internal, egress]
    deploy:
      resources:
        limits: *small

  # Desenvolvimento: composer, Pest, Pint e Larastan sobre o código montado (banco bitman_test).
  test:
    image: bitman-php:dev
    build:
      context: ./docker/php
      target: dev
    profiles: [dev]
    env_file: [.env]
    volumes:
      - ./backend:/var/www/html
      - ./.env:/var/www/html/.env:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal, egress]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Desenvolvimento: npm, Vitest, oxlint e tsc. O build de produção é feito na imagem do bitman-web.
  frontend:
    image: node:22-alpine
    profiles: [dev]
    working_dir: /app
    environment:
      VITE_GAMES_ORIGIN: ${GAMES_ORIGIN}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks: [egress]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [internal]
    deploy:
      resources:
        limits: *small
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  git-sandbox:
    # Tag própria: tests/infra/sandbox-fixtures.sh gera "bitman-git-sandbox" da árvore de trabalho.
    image: bitman-git-sandbox:release
    build:
      context: ./.release/docker/git-sandbox
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      HTTPS_PROXY: http://egress-proxy:8888
      HTTP_PROXY: http://egress-proxy:8888
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_ALLOW_PROTOCOL: https
      GIT_TERMINAL_PROMPT: "0"
      # G8: a sandbox só atende quem apresenta o token (o mesmo do backend).
      SANDBOX_TOKEN: ${SANDBOX_TOKEN}
    networks: [sandbox]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 128
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3

  egress-proxy:
    image: bitman-egress-proxy:release
    build:
      context: ./.release/docker/egress-proxy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [sandbox, egress]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

networks:
  prod-network:
    external: true
  # Banco, cache e php-fpm: sem saída para a internet.
  internal:
    internal: true
  # Saída para a internet (SMTP, npm), sem acesso aos dados.
  egress: {}
  # git-sandbox: sem internet; a única saída é o egress-proxy.
  sandbox:
    internal: true

volumes:
  postgres_data:
  redis_data:
  quarantine:
  artifacts:
  media:
  frontend_node_modules:
