expose_php = Off
memory_limit = 256M
upload_max_filesize = 4M
post_max_size = 8M
max_execution_time = 30

; PHP2Shell (CVE-2026-109618/109619): desabilita o upload-progress da sessão
; e os backtraces de erro fatal (PHP 8.5). Ver docs do PHP de 21/10/2026.
session.upload_progress.enabled = Off
fatal_error_backtraces = 0

opcache.enable = 1
opcache.enable_cli = 0
; Pré-lançamento: o código muda via bind mount, então os timestamps são revalidados.
opcache.validate_timestamps = 1
